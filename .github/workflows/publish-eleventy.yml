name: Publish Eleventy Atlas to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify published content
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/assets/atlas-theme.css
          for slug in julie-mehretu olafur-eliasson simone-leigh kara-walker cecilia-vicuna theaster-gates wolfgang-tillmans william-kentridge hito-steyerl arthur-jafa christian-marclay rafael-lozano-hemmer; do
            test -s "_site/artists/$slug/index.html"
            test -s "_site/$slug.html"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
