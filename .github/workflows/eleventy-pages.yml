name: Eleventy migration validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [eleventy-migration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Check generated pages and assets
        run: |
          test -s _site/index.html
          test -s _site/assets/site.css
          test -s _site/assets/atlas-theme.css
          test -s _site/artists/julie-mehretu/index.html
          test -s _site/julie-mehretu.html
          grep -q 'Julie Mehretu' _site/artists/julie-mehretu/index.html
          grep -q 'Read the complete research profile' _site/artists/julie-mehretu/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: eleventy-migration-site
          path: _site
